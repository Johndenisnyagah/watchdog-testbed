# Runs the published sbom-watchdog action against this repository every day,
# exactly as an adopter would. This file is sbom-watchdog's example.yml with
# two additions an adopter may want too: the compliance outputs are switched
# on, and a failed run still commits whatever state it collected (see the
# comments on the action step and the final step).
name: sbom-watchdog

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print the issues that would be filed instead of filing them"
        type: boolean
        default: true
  schedule:
    # 03:17 UTC. Offset off the hour deliberately: every cron on GitHub fires
    # at :00 and the queue is worst there. GitHub does not adjust for DST, so
    # this is 04:17 or 05:17 in Germany depending on the season.
    - cron: '17 3 * * *'

# Nothing at workflow level; the job below asks for exactly what it needs.
permissions: {}

concurrency:
  # The state file is a read-modify-write on a committed file, so two runs must
  # not interleave. Queue rather than cancel: cancelling throws away a
  # completed scan.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # A schedule event carries no inputs, so inputs.dry-run is empty. Resolving
  # it once here means an absent input files for real and only an explicit tick
  # previews, and every step reads the same value.
  DRY_RUN: ${{ inputs.dry-run || 'false' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit the state file, inventory and dated SBOM
      issues: write     # file and close issues

    steps:
      # Third-party actions, this one's own action included, are pinned by
      # commit SHA: a moving tag is somebody else's decision to run new code in
      # a job that can write to this repository.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the commit-back rebases onto origin before pushing.
          fetch-depth: 0

      # A scheduled or dispatched run pins github.sha when it is created, so
      # checkout can hand the job a tree older than the branch tip, which is
      # how two runs both decide they are bootstrapping. Re-read the state file
      # from the tip.
      - name: Sync the state file with the branch tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          remote_state="origin/${GITHUB_REF_NAME}:.sbom-watchdog/findings.json"
          if git cat-file -e "${remote_state}" 2>/dev/null; then
            mkdir -p .sbom-watchdog
            git show "${remote_state}" > .sbom-watchdog/findings.json
            echo "state file synced from origin/${GITHUB_REF_NAME}"
          else
            echo "no state file on origin yet - this run bootstraps"
          fi

      # continue-on-error is deliberate. The order is scan, diff, file issues,
      # write issue numbers into the state file, commit. If filing fails part
      # way, the numbers of the issues already created are in the state file on
      # disk, and they must still be committed below or those issues are filed
      # again tomorrow. The run is failed in the last step instead.
      - name: Scan for new vulnerabilities
        id: watchdog
        continue-on-error: true
        # v1.6. Adopters can write @v1 to follow compatible releases.
        uses: Johndenisnyagah/sbom-watchdog@8f60f142e5cd9293b80564f648e209c53c255193  # v1.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ env.DRY_RUN }}
          severity-threshold: 'High'
          write-inventory: 'true'
          write-sbom-history: 'true'

      # Runs after a failed scan too, so issue numbers collected before the
      # failure reach the repository. Never on a dry run: the commit is the
      # irreversible half and must be unreachable from a preview.
      - name: Commit the state file and audit trail
        if: >-
          always() && env.DRY_RUN != 'true' &&
          (steps.watchdog.outputs.should-commit == 'true' || steps.watchdog.outcome == 'failure')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.watchdog.outputs.commit-message }}
          OUTCOME: ${{ steps.watchdog.outcome }}
        run: |
          set -euo pipefail

          git add .sbom-watchdog/findings.json
          if [ -d sboms ]; then git add sboms; fi
          if [ -f SECURITY-INVENTORY.md ]; then git add SECURITY-INVENTORY.md; fi
          if git diff --cached --quiet; then
            echo "nothing staged; the files already match HEAD"
            exit 0
          fi

          # A failed composite action may leave its outputs empty. Only then is
          # a fallback message used, and it says what happened.
          if [ -z "${MESSAGE}" ]; then
            if [ "${OUTCOME}" = "failure" ]; then
              MESSAGE="Vulnerability state: partial run, issue filing failed [skip ci]"
            else
              echo "::error::no commit message from the action; refusing to commit"
              exit 1
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # actions/checkout v6 and later no longer persist a credential in
          # .git/config, so the token is passed explicitly.
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git commit -m "${MESSAGE}" -m "Run ${GITHUB_RUN_ID} of ${GITHUB_WORKFLOW}."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        env:
          NEW: ${{ steps.watchdog.outputs.new }}
          RESOLVED: ${{ steps.watchdog.outputs.resolved }}
          UNCHANGED: ${{ steps.watchdog.outputs.unchanged }}
          BOOTSTRAP: ${{ steps.watchdog.outputs.bootstrap }}
        run: |
          echo "dry run: ${DRY_RUN}"
          echo "bootstrap: ${BOOTSTRAP}"
          echo "new: ${NEW}  resolved: ${RESOLVED}  unchanged: ${UNCHANGED}"

      # The raw SBOM and Grype output, downloadable for a week.
      - name: Upload SBOM and scan output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-and-scan
          path: ${{ runner.temp }}/sbom-watchdog/*.json
          retention-days: 7
          if-no-files-found: warn

      # Last, so the commit above has already run.
      - name: Fail the run if the scan failed
        if: always() && steps.watchdog.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The sbom-watchdog step failed. Any issue numbers collected"
          echo "::error::before the failure were committed above, so those issues"
          echo "::error::will not be filed again."
          exit 1
